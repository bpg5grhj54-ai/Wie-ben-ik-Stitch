<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wie ben ik? – Afbeeldingen</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --text:#18212b; --muted:#65717d;
  --accent:#1769e0; --accent2:#0d55bd; --danger:#d92d20;
  --shadow:0 4px 16px rgba(0,0,0,.10);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid #dfe4e8;padding:12px 16px}
.top{max-width:1500px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0}
.stats{font-weight:800;font-size:1.05rem}
.progress{height:8px;background:#e3e7eb;border-radius:99px;overflow:hidden;margin-top:9px}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .2s}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;background:#e9edf1;color:#1d2730}
button:hover{filter:brightness(.97)}
button.primary{background:var(--accent);color:#fff}
button.danger{background:#fee4e2;color:#b42318}
main{max-width:1500px;margin:18px auto;padding:0 14px 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;position:relative;border:2px solid transparent;transition:.18s}
.card.checked{opacity:.45;border-color:#aab2bb}
.card.checked img{filter:grayscale(1)}
.card .imgwrap{position:relative;background:#eee;aspect-ratio:3508/2480;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.card.checked .cross{display:flex}
.cross{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:6rem;font-weight:900;color:var(--danger);text-shadow:0 2px 8px rgba(0,0,0,.3);pointer-events:none}
.caption{padding:9px 10px 6px;font-size:.88rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:7px;padding:0 10px 10px}
.actions button{flex:1;font-size:.82rem;padding:8px 6px}
.card.checked .toggle{background:#dfe4e8}
.hint{color:var(--muted);font-size:.86rem;margin:8px 0 0}
.empty{padding:30px;text-align:center;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modalbox{position:relative;max-width:min(1100px,96vw);max-height:94vh;background:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column}
.modalbox img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:10px}
.modaltitle{text-align:center;font-weight:800;padding:8px 30px 4px}
.close{position:absolute;right:10px;top:10px;background:#fff;border-radius:50%;width:40px;height:40px;padding:0;font-size:24px;line-height:40px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.codeModal .modalbox{min-width:min(420px,92vw);align-items:center}
.code{font-size:4rem;letter-spacing:.18em;font-weight:900;padding:20px 10px 28px}
.codeSub{color:var(--muted);text-align:center;padding-bottom:18px}
@media(max-width:700px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  main{padding:0 8px 20px}
  .caption{font-size:.78rem}
  .actions button{font-size:.74rem}
  h1{font-size:1.05rem}
}
@media(min-width:1100px){
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>🧩 Wie ben ik? – overzicht</h1>
      <div class="stats" id="stats">0 / 0 afgestreept</div>
    </div>
    <div class="controls">
      <button class="primary" id="undoBtn">↩️ Laatste ongedaan</button>
      <button id="showAllBtn">👁️ Alles tonen</button>
      <button class="danger" id="resetBtn">♻️ Alles herstellen</button>
    </div>
  </div>
  <div class="top"><div class="progress" style="width:100%"><div id="bar"></div></div></div>
</header>

<main>
  <p class="hint">Klik op <b>Afstrepen</b> om een afbeelding af te vinken. Dubbelklik op een afbeelding voor de 3-cijferige code. Gebruik 🔍 om een afbeelding groot te bekijken.</p>
  <section class="grid" id="grid"></section>
</main>

<div class="modal" id="imageModal">
  <div class="modalbox">
    <button class="close" id="closeImage">×</button>
    <img id="largeImage" alt="">
    <div class="modaltitle" id="largeTitle"></div>
  </div>
</div>

<div class="modal codeModal" id="codeModal">

</div>

const KEY = "wie-ben-ik-afgestreept-v1";
const CODEKEY = "wie-ben-ik-codes-v1";

let checked = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let codes = JSON.parse(localStorage.getItem(CODEKEY) || "{}");
let history = [];

function save(){
  localStorage.setItem(KEY, JSON.stringify([...checked]));
  localStorage.setItem(CODEKEY, JSON.stringify(codes));
}

function randomCode(){
  return String(Math.floor(100 + Math.random()*900));
}

function getCode(item){
  if(item.fixedCode) return item.fixedCode;
  if(!codes[item.id]){
    codes[item.id] = randomCode();
    save();
  }
  return codes[item.id];
}

  ITEMS.forEach(item=>{
    const card=document.createElement("article");
    card.className="card"+(checked.has(item.id)?" checked":"");
    card.dataset.id=item.id;
    card.innerHTML=`
      <div class="imgwrap">
        <img src="${item.src}" alt="${escapeHtml(item.title)}" loading="lazy">
        <div class="cross">✕</div>
      </div>
      <div class="caption" title="${escapeHtml(item.filename)}">${escapeHtml(item.title)}</div>
      <div class="actions">
        <button class="toggle">${checked.has(item.id)?"☑️ Afgevinkt":"☐ Afstrepen"}</button>
        <button class="zoom">🔍 Groot</button>
      </div>`;
    card.querySelector(".toggle").addEventListener("click",e=>{
      e.stopPropagation();
      toggle(item.id);
    });
    card.querySelector(".zoom").addEventListener("click",e=>{
      e.stopPropagation();
      openImage(item);
    });
    card.addEventListener("dblclick",()=>openCode(item));
    grid.appendChild(card);
  });
  updateStats();
}

function toggle(id){
  history.push(new Set(checked));
  if(checked.has(id)) checked.delete(id); else checked.add(id);
  save(); render();
}

function updateStats(){
  const n=checked.size, total=ITEMS.length;
  document.getElementById("stats").textContent=`${n} / ${total} afgestreept`;
  document.getElementById("bar").style.width=(n/total*100)+"%";
}

function undo(){
  if(!history.length) return;
  checked=history.pop();
  save(); render();
}

function openImage(item){
  document.getElementById("largeImage").src=item.src;
  document.getElementById("largeImage").alt=item.title;
  document.getElementById("largeTitle").textContent=item.title;
  document.getElementById("imageModal").classList.add("open");
}
function openCode(item){
  document.getElementById("codeTitle").textContent=item.title;
  document.getElementById("codeValue").textContent=getCode(item);
  document.getElementById("codeModal").classList.add("open");
}
function closeModal(id){document.getElementById(id).classList.remove("open")}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.getElementById("undoBtn").onclick=undo;
document.getElementById("showAllBtn").onclick=()=>{
  history.push(new Set(checked)); checked.clear(); save(); render();
};
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("Alle afgestreepte afbeeldingen herstellen?")){
    history.push(new Set(checked)); checked.clear(); save(); render();
  }
};
document.getElementById("closeImage").onclick=()=>closeModal("imageModal");
document.getElementById("closeCode").onclick=()=>closeModal("codeModal");
document.getElementById("imageModal").addEventListener("click",e=>{if(e.target.id==="imageModal") closeModal("imageModal")});
document.getElementById("codeModal").addEventListener("click",e=>{if(e.target.id==="codeModal") closeModal("codeModal")});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeModal("imageModal");closeModal("codeModal")}
});

render();
</script>
</body>
</html>
